# Video İndir programını gerçek bir Windows üzerinde dener. Yalnızca
# videoindir klasörü değiştiğinde çalışır; siteyle ilgili değişikliklerde çalışmaz.
name: Video İndir (Windows denemesi)

on:
  push:
    paths:
      - 'videoindir/**'
      - '.github/workflows/videoindir.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videoindir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: videoindir/kaynak/go.mod
          cache-dependency-path: videoindir/kaynak/go.sum

      - name: Birim testleri
        working-directory: videoindir/kaynak
        run: go test ./...

      - name: Program Windows'ta deneniyor
        shell: pwsh
        run: videoindir/kaynak/deneme/windows.ps1
